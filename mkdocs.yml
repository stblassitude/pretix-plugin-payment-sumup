site_name: pretix SumUp Hosted Checkout
site_description: Accept SumUp payments in your self-hosted pretix through SumUp Hosted Checkout.
site_url: https://stblassitude.github.io/pretix-plugin-payment-sumup/
repo_url: https://github.com/stblassitude/pretix-plugin-payment-sumup
repo_name: stblassitude/pretix-plugin-payment-sumup
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.action.edit
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

nav:
  - Overview: index.md
  - Setup:
      - Installation: installation.md
      - SumUp account setup: sumup-setup.md
      - Configuration in pretix: configuration.md
  - Operations:
      - Notes and gotchas: gotchas.md
      - Troubleshooting: troubleshooting.md
  - Development:
      - Docker sandbox: sandbox.md
      - Development and releases: development.md
      - Changelog: changelog.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
