[project]
name = "pretix-payment-sumup"
# Placeholder. The release workflow replaces it with the version from the git tag (v1.2.3 -> 1.2.3).
version = "0.0.0.dev0"
description = "pretix payment provider for SumUp Hosted Checkout"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["pretix", "sumup", "payment"]
authors = [
    {name = "Stefan Bethke", email = "stb@lassitu.de"},
]
maintainers = [
    {name = "Stefan Bethke", email = "stb@lassitu.de"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Intended Audience :: Other Audience",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "requests",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-django",
    "responses",
    "flake8",
    "isort",
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5",
]

[project.entry-points."pretix.plugin"]
pretix_payment_sumup = "pretix_payment_sumup:PretixPluginMeta"

[build-system]
requires = [
    "setuptools>=77",
]
build-backend = "setuptools.build_meta"

[project.urls]
homepage = "https://stblassitude.github.io/pretix-plugin-payment-sumup/"
repository = "https://github.com/stblassitude/pretix-plugin-payment-sumup"
documentation = "https://stblassitude.github.io/pretix-plugin-payment-sumup/"
issues = "https://github.com/stblassitude/pretix-plugin-payment-sumup/issues"

[tool.setuptools]
packages = ["pretix_payment_sumup"]
include-package-data = false

[tool.setuptools.package-data]
pretix_payment_sumup = ["templates/**/*.html", "locale/*/LC_MESSAGES/*.po", "locale/*/LC_MESSAGES/*.mo"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "pretix.testutils.settings"
testpaths = ["tests"]

[tool.isort]
combine_as_imports = true
default_section = "THIRDPARTY"
include_trailing_comma = true
known_first_party = "pretix_payment_sumup"
known_third_party = "pretix"
multi_line_output = 5
line_length = 120
