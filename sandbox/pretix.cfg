[pretix]
instance_name=pretix SumUp sandbox
; Overridden by the PRETIX_PRETIX_URL environment variable, see docker-compose.yml.
url=http://localhost:8345
currency=EUR
datadir=/data
trust_x_forwarded_for=on
trust_x_forwarded_proto=on

[database]
backend=postgresql
name=pretix
user=pretix
password=pretix
host=postgres

[mail]
from=tickets@sandbox.invalid
host=mailpit
port=1025

[redis]
location=redis://redis/0
sessions=true

[celery]
backend=redis://redis/1
broker=redis://redis/2

[logging]
level=INFO
